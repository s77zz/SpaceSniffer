name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # 触发条件：推送 v1.0.0 这类 tag

permissions:
  contents: write  # 允许创建 Release 和上传附件

jobs:
  build-and-release:
    runs-on: windows-latest  # WPF 必须在 Windows 上构建

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $repo      = "${{ github.repository }}"

          # Find the previous tag; fall back to the very first commit if none exists.
          # On the first release this will include all commits since the project started.
          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $previousTag) {
            $previousTag = git rev-list --max-parents=0 HEAD
            $range       = $previousTag + ".." + $currentTag
          } else {
            $range = $previousTag + ".." + $currentTag
          }

          # Collect commits (hash|author|subject), skip merge commits
          $commits = git log $range --pretty=format:"%H|%an|%s" --no-merges

          # Category buckets
          $sections = [ordered]@{
            "feat"                    = @{ title = "✨ New Features";     entries = [System.Collections.Generic.List[string]]::new() }
            "fix"                     = @{ title = "🐛 Bug Fixes";        entries = [System.Collections.Generic.List[string]]::new() }
            "perf"                    = @{ title = "⚡ Performance";       entries = [System.Collections.Generic.List[string]]::new() }
            "refactor"                = @{ title = "♻️ Refactoring";       entries = [System.Collections.Generic.List[string]]::new() }
            "docs"                    = @{ title = "📝 Documentation";     entries = [System.Collections.Generic.List[string]]::new() }
            "test"                    = @{ title = "🧪 Tests";             entries = [System.Collections.Generic.List[string]]::new() }
            "chore|ci|build"          = @{ title = "🔧 Chores / CI";       entries = [System.Collections.Generic.List[string]]::new() }
            "other"                   = @{ title = "📦 Other Changes";     entries = [System.Collections.Generic.List[string]]::new() }
          }

          foreach ($line in $commits) {
            if (-not $line) { continue }
            $parts   = $line -split '\|', 3
            $hash    = $parts[0]
            $author  = $parts[1]
            $subject = $parts[2]
            $short   = $hash.Substring(0, 7)
            $url     = "https://github.com/$repo/commit/$hash"
            $entry   = "- [$short]($url) — $subject — $author"

            $matched = $false
            foreach ($key in $sections.Keys) {
              $prefixes = $key -split '\|'
              foreach ($prefix in $prefixes) {
                if ($subject -match "^$([regex]::Escape($prefix))(\(.+\))?!?:") {
                  $sections[$key].entries.Add($entry)
                  $matched = $true
                  break
                }
              }
              if ($matched) { break }
            }
            if (-not $matched) {
              $sections["other"].entries.Add($entry)
            }
          }

          # Build the markdown body
          $md = [System.Text.StringBuilder]::new()
          foreach ($key in $sections.Keys) {
            $sec = $sections[$key]
            if ($sec.entries.Count -gt 0) {
              [void]$md.AppendLine("## $($sec.title)")
              [void]$md.AppendLine("")
              foreach ($e in $sec.entries) { [void]$md.AppendLine($e) }
              [void]$md.AppendLine("")
            }
          }

          # Full diff link
          $diffBase = if ($previousTag -match '^[0-9a-fA-F]{40}$') { $previousTag.Substring(0,7) } else { $previousTag }
          [void]$md.AppendLine("**Full diff:** https://github.com/$repo/compare/$diffBase...$currentTag")

          # Write to a file and expose via env so the release step can read it
          $body = $md.ToString()
          $body | Out-File -FilePath changelog.md -Encoding utf8
          "CHANGELOG_PATH=changelog.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish SpaceSniffer/SpaceSniffer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/

      - name: Zip artifact
        run: Compress-Archive -Path publish/* -DestinationPath SpaceSniffer-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpaceSniffer ${{ github.ref_name }}
          body_path: ${{ env.CHANGELOG_PATH }}
          draft: false
          prerelease: false
          files: SpaceSniffer-${{ github.ref_name }}-win-x64.zip
